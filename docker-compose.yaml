---
x-abs-common:
  &abs-common
  image: abs/frankenphp:8.5
  # build: .
  environment:
    &abs-common-env
    APP_NAME: abs
  volumes:
    - ./deploy/custom_php.ini:/usr/local/etc/php/conf.d/0_custom_php.ini:ro
    - ./:/app
    - /etc/localtime:/etc/localtime:ro
    - /etc/timezone:/etc/timezone:ro

services:
  web:
    <<: *abs-common
    command: php -d variables_order=EGPCS artisan octane:frankenphp --host 0.0.0.0 --port 4050 --admin-port 4051 --caddyfile /app/deploy/Caddyfile
    ports:
      - "4050:4050"
    restart: always

  queue:
    <<: *abs-common
    command: php artisan queue:work --queue=abs-sync,default --sleep=3 --tries=4 --timeout=120
    restart: always

  cron:
    <<: *abs-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        crontab /app/deploy/crontab
        cron -f -L 3
    restart: always

  command:
    <<: *abs-common
    command: tail -f /dev/null
    profiles: [ "command" ]
    restart: no

